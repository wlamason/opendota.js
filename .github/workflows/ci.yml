name: CI

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        # Saturday 04:30 UTC (00:30 Saturday US Eastern during daylight time,
        # 23:30 Friday US Eastern during standard time).
        - cron: "30 4 * * 6"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run lint
            - run: npm run test:unit
            - run: npm run test:integration
